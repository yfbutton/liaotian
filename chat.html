<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线聊天室</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    
    /* 登录屏 */
    #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #1a1a2e; border-radius: 16px; padding: 40px; width: 340px; text-align: center; border: 1px solid #2a2a4a; }
    .login-box h1 { margin-bottom: 8px; font-size: 24px; }
    .login-box p { color: #888; margin-bottom: 24px; font-size: 14px; }
    .login-box input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #0f0f1a; color: #fff; font-size: 16px; outline: none; }
    .login-box input:focus { border-color: #6c63ff; }
    .login-box button { width: 100%; margin-top: 16px; padding: 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, #6c63ff, #4facfe); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .login-box button:hover { opacity: 0.9; }

    /* 聊天界面 */
    #chat-screen { display: none; flex-direction: column; height: 100vh; }
    
    /* 顶栏 */
    .header { background: #1a1a2e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2a4a; }
    .header h2 { font-size: 18px; }
    .online-count { font-size: 13px; color: #4facfe; }
    
    /* 消息区 */
    .messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; animation: fadeIn 0.2s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-other { background: #1e1e3a; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-self { background: linear-gradient(135deg, #6c63ff, #4facfe); align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-system { background: transparent; color: #888; font-size: 12px; align-self: center; text-align: center; padding: 4px 12px; }
    
    .msg-header { font-size: 11px; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
    .msg-self .msg-header { color: rgba(255,255,255,0.7); }
    .msg-time { font-size: 10px; opacity: 0.6; }
    
    /* 输入区 */
    .input-area { background: #1a1a2e; padding: 12px 20px; display: flex; gap: 10px; border-top: 1px solid #2a2a4a; }
    .input-area input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #333; background: #0f0f1a; color: #fff; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: #6c63ff; }
    .input-area button { padding: 12px 20px; border-radius: 24px; border: none; background: linear-gradient(135deg, #6c63ff, #4facfe); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .input-area button:hover { opacity: 0.9; }
    
    /* 侧边栏 */
    .sidebar { position: fixed; top: 60px; right: 20px; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 12px; min-width: 140px; display: none; z-index: 100; }
    .sidebar.show { display: block; }
    .sidebar h4 { font-size: 12px; color: #888; margin-bottom: 8px; }
    .sidebar .user-item { padding: 4px 0; font-size: 13px; color: #4facfe; }
    
    .btn-online { background: none; border: 1px solid #333; color: #e0e0e0; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
    .btn-online:hover { border-color: #6c63ff; }
  </style>
</head>
<body>

<!-- 登录屏 -->
<div id="login-screen">
  <div class="login-box">
    <h1>💬 聊天室</h1>
    <p>输入你的昵称开始聊天</p>
    <input type="text" id="username-input" placeholder="你的昵称..." maxlength="20" autofocus>
    <button onclick="joinChat()">进入聊天室</button>
  </div>
</div>

<!-- 聊天界面 -->
<div id="chat-screen">
  <div class="header">
    <h2>💬 在线聊天室</h2>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="online-count" id="online-count"></span>
      <button class="btn-online" onclick="toggleSidebar()">👥 在线</button>
    </div>
  </div>
  
  <div class="messages" id="messages"></div>
  
  <div class="input-area">
    <input type="text" id="msg-input" placeholder="输入消息..." maxlength="500" onkeydown="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()">发送</button>
  </div>
  
  <div class="sidebar" id="sidebar">
    <h4>在线用户</h4>
    <div id="online-list"></div>
  </div>
</div>

<script>
  let socket, myName, isSelf = false;

  function joinChat() {
    const input = document.getElementById('username-input');
    myName = input.value.trim() || '匿名用户';
    if (!socket) {
      socket = io({ path: '/ws/socket.io' });
      setupListeners();
    }
    socket.emit('set_name', { name: myName });
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
  }

  function setupListeners() {
    socket.on('connect', () => {
      console.log('已连接');
    });
    socket.on('message', (msg) => appendMessage(msg, false));
    socket.on('system', (msg) => appendMessage(msg, true));
    socket.on('history', (data) => {
      data.messages.forEach(m => appendMessage(m, m.type === 'system'));
    });
    socket.on('online_users', (data) => {
      document.getElementById('online-count').textContent = `${data.users.length} 人在线`;
      renderOnlineList(data.users);
    });
  }

  function appendMessage(msg, isSystem) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    
    if (isSystem) {
      div.className = 'msg msg-system';
      div.textContent = msg.text;
    } else {
      div.className = `msg ${msg.user === myName ? 'msg-self' : 'msg-other'}`;
      const header = document.createElement('div');
      header.className = 'msg-header';
      header.innerHTML = `<span>${msg.user}</span><span class="msg-time">${msg.time}</span>`;
      const text = document.createElement('div');
      text.textContent = msg.text;
      div.appendChild(header);
      div.appendChild(text);
    }
    
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    socket.emit('chat_message', { text });
    input.value = '';
    input.focus();
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('show');
  }

  function renderOnlineList(users) {
    const list = document.getElementById('online-list');
    list.innerHTML = users.map(u => `<div class="user-item">${u === myName ? u + ' (我)' : u}</div>`).join('');
  }

  document.getElementById('username-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinChat();
  });
</script>
</body>
</html>
